name: Publish MNQ premarket data

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC. We schedule both possible UTC equivalents
    # of 05:20 America/Los_Angeles. The Python script runs only during the
    # 05:00 Pacific hour, so one invocation is automatically ignored.
    - cron: "20 12 * * 1-5"
    - cron: "20 13 * * 1-5"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull Topstep MNQ market data
        env:
          TOPSTEP_USERNAME: ${{ secrets.TOPSTEP_USERNAME }}
          TOPSTEP_API_KEY: ${{ secrets.TOPSTEP_API_KEY }}
          TOPSTEP_LIVE_DATA: "false"
        run: python scripts/mnq_daily.py

      - name: Publish latest market-data JSON
        run: |
          if git diff --quiet -- public/mnq_latest.json; then
            echo "No market-data changes to commit."
            exit 0
          fi
          git config user.name "mnq-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/mnq_latest.json
          git commit -m "Update MNQ premarket data"
          git push
