name: Mirror MNQ morning data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Guard Pacific schedule
        id: schedule_guard
        if: github.event_name == 'schedule'
        run: |
          PT_HOUR="$(TZ=America/Los_Angeles date +%H)"
          PT_DOW="$(TZ=America/Los_Angeles date +%u)"
          echo "Pacific hour: $PT_HOUR, weekday: $PT_DOW"

          if [ "$PT_HOUR" = "05" ] && [ "$PT_DOW" -le 5 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "In the intended 05:00 Pacific window."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Outside the intended 05:00 Pacific window. Skipping cleanly."
          fi

      - name: Fetch Railway MNQ morning JSON
        if: github.event_name == 'workflow_dispatch' || steps.schedule_guard.outputs.should_run == 'true'
        run: |
          mkdir -p public mnq

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 60 \
            "https://trade-data-production.up.railway.app/mnq-morning.json" \
            -o /tmp/mnq-morning.json

          jq -e '
            .snapshot != null
            and .snapshot.contract.name != null
            and .snapshot.latest.bar5m != null
            and .snapshot.generatedUtc != null
          ' /tmp/mnq-morning.json > /dev/null

          SNAPSHOT_TS="$(jq -r '.snapshot.generatedUtc' /tmp/mnq-morning.json)"
          SNAPSHOT_EPOCH="$(date -d "$SNAPSHOT_TS" +%s)"
          NOW_EPOCH="$(date +%s)"
          AGE=$((NOW_EPOCH - SNAPSHOT_EPOCH))

          echo "Snapshot age: ${AGE}s"

          if [ "$AGE" -gt 900 ]; then
            echo "Railway snapshot is more than 15 minutes old. Refusing to publish stale data."
            exit 1
          fi

          cp /tmp/mnq-morning.json public/mnq-morning.json

      - name: Build static GitHub Pages HTML
        if: github.event_name == 'workflow_dispatch' || steps.schedule_guard.outputs.should_run == 'true'
        run: |
          GENERATED_UTC="$(jq -r '.generatedUtc // .snapshot.generatedUtc' /tmp/mnq-morning.json)"
          GENERATED_PT="$(jq -r '.generatedPacific // .snapshot.generatedPacific // "unknown"' /tmp/mnq-morning.json)"
          CONTRACT="$(jq -r '.snapshot.contract.name // "unknown"' /tmp/mnq-morning.json)"

          {
            printf '%s\n' '<!doctype html>'
            printf '%s\n' '<html lang="en">'
            printf '%s\n' '<head>'
            printf '%s\n' '  <meta charset="utf-8">'
            printf '%s\n' '  <meta name="viewport" content="width=device-width,initial-scale=1">'
            printf '%s\n' '  <meta name="robots" content="noindex,nofollow">'
            printf '%s\n' '  <title>MNQ Morning Data</title>'
            printf '%s\n' '  <style>'
            printf '%s\n' '    body{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;margin:24px;line-height:1.35;background:#fff;color:#111}'
            printf '%s\n' '    h1{font-family:system-ui,sans-serif;margin-bottom:6px}'
            printf '%s\n' '    .meta{font-family:system-ui,sans-serif;color:#555;margin-bottom:18px}'
            printf '%s\n' '    pre{white-space:pre-wrap;word-break:break-word}'
            printf '%s\n' '  </style>'
            printf '%s\n' '</head>'
            printf '%s\n' '<body>'
            printf '%s\n' '  <h1>MNQ Morning Data</h1>'
            printf '  <div class="meta">Contract: %s · Generated UTC: %s · Generated Pacific: %s</div>\n' \
              "$CONTRACT" "$GENERATED_UTC" "$GENERATED_PT"
            printf '%s\n' '  <pre id="mnq-data">'
            jq . /tmp/mnq-morning.json | \
              sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'
            printf '%s\n' '  </pre>'
            printf '%s\n' '</body>'
            printf '%s\n' '</html>'
          } > mnq/index.html

      - name: Commit mirrored market data
        if: github.event_name == 'workflow_dispatch' || steps.schedule_guard.outputs.should_run == 'true'
        run: |
          git config user.name "mnq-mirror-bot"
          git config user.email "actions@users.noreply.github.com"

          git add public/mnq-morning.json mnq/index.html

          if git diff --cached --quiet; then
            echo "No market-data changes to commit."
            exit 0
          fi

          git commit -m "Mirror MNQ morning data"
          git push
